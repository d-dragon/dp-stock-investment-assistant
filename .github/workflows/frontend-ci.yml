name: Frontend CI

on:
  push:
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '26.13.1'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npx vitest run --project unit

      - name: Build
        run: npm run build

      - name: OpenAPI drift
        run: npm run gen:api && git diff --exit-code src/platform/api/generated

      - name: Storybook
        run: npm run build-storybook

      - name: Storybook axe
        run: npx playwright install --with-deps chromium && npx vitest run --project storybook

      - name: Playwright
        run: npx playwright install --with-deps chromium && npx playwright test
