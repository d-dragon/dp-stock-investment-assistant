name: publish-week39-2026-09-24
on:
  workflow_dispatch:
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: project-website-pages
      - name: Decode zlib payload into week-39.json
        run: |
          python3 - <<'PY'
          import base64, zlib, json
          z = open("docs/sites/data/2026-09/.week39.zlib.b64").read().strip()
          raw = zlib.decompress(base64.b64decode(z))
          open("docs/sites/data/2026-09/week-39.json", "wb").write(raw)
          d = json.loads(raw)
          days = [x["date"] for x in d["days"]]
          assert "2026-09-24" in days
          print("days", days)
          print("session", d["days"][days.index("2026-09-24")]["report"]["marketSession"])
          print("bytes", len(raw))
          PY
          rm -f docs/sites/data/2026-09/.week39.zlib.b64
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/sites/data/2026-09/week-39.json
          git add -u docs/sites/data/2026-09/.week39.zlib.b64 || true
          git commit -m "Publish daily market brief 2026-09-24 (dashboard v2.3 schema)"
          git push
