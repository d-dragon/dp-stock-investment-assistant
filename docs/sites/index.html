<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Market Daily Updates - DP Stock-Investment Assistant</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 40px 20px;
      background: #0d1117;
      color: #c9d1d9;
      display: flex;
      justify-content: center;
    }
    .container {
      max-width: 760px;
      width: 100%;
    }
    a.back-link {
      color: #8b949e;
      text-decoration: none;
      font-size: 0.9rem;
      display: inline-block;
      margin-bottom: 20px;
    }
    a.back-link:hover { color: #58a6ff; }
    h1 { color: #58a6ff; font-size: 1.8rem; margin: 0 0 8px 0; }
    p.desc { color: #8b949e; margin: 0 0 24px 0; line-height: 1.5; }
    .site-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .site-item {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 6px;
      transition: border-color 0.2s;
    }
    .site-item:hover { border-color: #58a6ff; }
    .site-item a {
      display: block;
      padding: 14px 16px;
      color: #58a6ff;
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 500;
    }
    .status-msg {
      color: #8b949e;
      font-size: 0.9rem;
      padding: 16px;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <div class="container">
    <a class="back-link" href="../index.html">← Back to Overview</a>
    <h1>📅 Market Daily Updates</h1>
    <p class="desc">Archive of daily market digests and tracking signals.</p>

    <ul class="site-list" id="daily-sites-list">
      <li class="status-msg">Scanning updates...</li>
    </ul>
  </div>

  <script>
    async function loadDailySites() {
      const listEl = document.getElementById('daily-sites-list');
      try {
        const res = await fetch('https://api.github.com/repos/d-dragon/dp-stock-investment-assistant/contents/docs/sites');
        if (!res.ok) throw new Error('Directory not found or empty');
        const files = await res.json();
        
        const htmlFiles = files
          .filter(f => f.name.endsWith('.html') && f.name !== 'index.html')
          .reverse();

        if (htmlFiles.length === 0) {
          listEl.innerHTML = '<li class="status-msg">No daily reports published yet.</li>';
          return;
        }

        listEl.innerHTML = htmlFiles
          .map(f => `
            <li class="site-item">
              <a href="${f.name}">📄 ${f.name.replace('.html', '')}</a>
            </li>
          `)
          .join('');
      } catch (err) {
        listEl.innerHTML = '<li class="status-msg">Check back soon for daily reports.</li>';
      }
    }
    loadDailySites();
  </script>
</body>
</html>
